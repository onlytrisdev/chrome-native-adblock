name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag such as v1.0.0
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test and package
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Create or update prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath ".\artifacts\release\$env:RELEASE_VERSION" -File | ForEach-Object FullName
          if (gh release view $env:RELEASE_VERSION 2>$null) {
            gh release upload $env:RELEASE_VERSION @assets --clobber
          } else {
            gh release create $env:RELEASE_VERSION @assets --generate-notes --title "Chrome Native Adblock $env:RELEASE_VERSION"
          }
